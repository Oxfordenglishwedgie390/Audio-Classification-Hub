[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioauth"
version = "1.0.0"
description = "Your personal voice authentication SDK — generated by Audio Classification Hub"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "torch>=2.0",
    "speechbrain>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
